# Ocean and San Francisco Bay District sport fishing rules, 2026.
# Entered by hand from the CDFW booklet and groundfish summary page below.
# Every rule cites its CCR section. Re-check before relying on it.
#
# Rule fields
#   species   species ids, "group:<name>" (see species.yaml groups), or "any"
#   where     water: salt | fresh, ocean_area: [...], lat_min/lat_max/lon_min/lon_max,
#             district: [...], county: [...], water_body: [...], water_kind: [...]
#   season    closed windows: {from, to, status: closed, modes: [boat|shore|dive], note}
#             dates are MM-DD or tokens (last-sat-apr, fri-before-last-sat-apr,
#             sat-before-memorial-day, fri-before-sat-before-memorial-day, last-day-feb)
#   periods   date windows that change size/bag: {from, to, size, bag, note}
#   size      {min, max, type: TL|FL}  (an empty size {} means "no size limit")
#   bag       {daily, note}
#   prohibited  true: may not be kept at any time
#   check     the app can't confirm legality (quota, hatchery marks, local closures)

meta:
  title: 2026 California Ocean Sport Fishing Regulations
  url: https://nrm.dfg.ca.gov/FileHandler.ashx?DocumentID=239985&inline
  publication_updated: 2026-07-17
  verified: 2026-09-30
  effective: {from: 2026-01-01, to: 2026-12-31}

groundfish_url: &gf https://wildlife.ca.gov/Fishing/Ocean/Regulations/Groundfish-Summary

rules:

- id: ocean_general
  species: [any]
  where: {water: salt}
  bag: {daily: 10, note: "General limit: 20 finfish in combination, no more than 10 of any one species."}
  source: {ccr: "T14 CCR §27.60(a)"}

# --------------------------------------------------------------- groundfish
- id: groundfish_nearshore_season
  species: [group:nearshore_rockfish, group:cabezon_greenling]
  where: {water: salt}
  season:
    - {from: 01-01, to: 03-31, status: closed, modes: [boat], note: "Boat-based take closed Jan 1 – Mar 31 in all areas."}
  notes:
    - "Shore-based anglers and divers are exempt from groundfish season and depth restrictions (§27.20(b)(1)(C)–(D))."
    - "Boat anglers must carry a descending device (§27.20(b)(2))."
  source: {ccr: "T14 CCR §§27.20, 27.25–27.45, 28.28, 28.29, 28.55", url: *gf}

- id: groundfish_nearshore_southern
  species: [group:nearshore_rockfish, group:cabezon_greenling]
  where: {water: salt, ocean_area: [southern]}
  season:
    - {from: 10-01, to: 12-31, status: closed, modes: [boat], note: "Southern area: nearshore rockfish, cabezon and greenlings closed to boats Oct 1 – Dec 31."}
  notes:
    - "Southern area Jul 1 – Sep 30: boats may fish only shoreward of the 50-fathom line."
  source: {ccr: "T14 CCR §27.45", url: *gf}

- id: groundfish_shelf_season
  species: [group:shelf_rockfish, lingcod]
  where: {water: salt}
  season:
    - {from: 01-01, to: 03-31, status: closed, modes: [boat], note: "Boat-based take closed Jan 1 – Mar 31 in all areas."}
  notes:
    - "Shore-based anglers and divers are exempt from groundfish season and depth restrictions (§27.20(b)(1)(C)–(D))."
  source: {ccr: "T14 CCR §§27.20, 27.25–27.45, 28.27, 28.55", url: *gf}

- id: groundfish_shelf_southern_depth
  species: [group:shelf_rockfish, lingcod]
  where: {water: salt, ocean_area: [southern]}
  periods:
    - {from: 07-01, to: 09-30, note: "Southern area Jul 1 – Sep 30: boats may fish only shoreward of the 50-fathom (300 ft) line."}
    - {from: 10-01, to: 12-31, note: "Southern area Oct 1 – Dec 31: boats may fish only seaward of the 50-fathom (300 ft) line."}
  source: {ccr: "T14 CCR §27.45", url: *gf}

- id: rockfish
  species: [group:rockfish]
  where: {water: salt}
  size: {}
  bag: {daily: 10, note: "10 fish in the Rockfish, Cabezon and Greenling (RCG) complex combined."}
  source: {ccr: "T14 CCR §28.55"}

- id: rockfish_prohibited
  species: [yelloweye_rockfish, cowcod, bronzespotted_rockfish, quillback_rockfish]
  where: {water: salt}
  prohibited: true
  notes: ["Bronzespotted rockfish, cowcod, quillback rockfish and yelloweye rockfish may not be retained at any time."]
  source: {ccr: "T14 CCR §28.55(b)(1)"}

- id: vermilion_sunset_northern
  species: [group:vermilion_sunset]
  where: {water: salt, ocean_area: [northern]}

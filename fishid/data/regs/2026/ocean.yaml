  bag: {daily: 2, note: "Vermilion/sunset rockfish: 2 within the RCG limit (all areas south of 40°10′ N)."}
  source: {ccr: "T14 CCR §28.55(b)(2)(B)"}

- id: copper_rockfish
  species: [copper_rockfish]
  where: {water: salt}
  bag: {daily: 1, note: "Copper rockfish: 1 within the RCG limit."}
  source: {ccr: "T14 CCR §28.55(b)(3)"}

- id: canary_rockfish
  species: [canary_rockfish]
  where: {water: salt}
  bag: {daily: 2, note: "Canary rockfish: 2 within the RCG limit."}
  source: {ccr: "T14 CCR §28.55(b)(4)"}

- id: lingcod
  species: [lingcod]
  where: {water: salt}
  size: {min: 22, type: TL}
  bag: {daily: 2}
  source: {ccr: "T14 CCR §28.27"}

- id: cabezon_greenling
  species: [group:cabezon_greenling]
  where: {water: salt}
  size: {}

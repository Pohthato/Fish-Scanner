# --------------------------------------------------------------- prohibited
- id: ocean_prohibited
  species: [garibaldi, giant_sea_bass, white_shark, green_sturgeon]
  where: {}
  prohibited: true
  notes: ["Release immediately. White shark and green sturgeon may not be removed from the water."]
  source: {ccr: "T14 CCR §§28.05, 28.10, 28.06, 27.91, 5.81"}

- id: white_sturgeon_ocean
  species: [white_sturgeon]
  where: {water: salt}
  prohibited: true
  notes: ["White sturgeon are catch-and-release only. Sturgeon over 60 in fork length may not be removed from the water. A Sturgeon Fishing Report Card is required."]
  source: {ccr: "T14 CCR §27.90"}

# California recreational fish species.
#
# id           unique snake_case id (referenced by regulations)
# common       common names; the first is the display name
# scientific   binomial
# water        salt | fresh | both
# measure      TL (total length) or FL (fork length) — how CDFW measures this species
# groups       regulation groups this species belongs to (see regs/*.yaml)
# lookalikes   ids of species commonly confused with this one
# hazards      venomous_spines | sharp_teeth | sharp_gill_covers | spines | barbels | toxic_skin
# protected    true if take is prohibited statewide
# regions      ocean: northern | mendocino | san_francisco | central | southern
#              fresh: north_coast | north_central | south_central | southern_fw | sierra | valley | colorado_river
#              "all" means anywhere in that water type


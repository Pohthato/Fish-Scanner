[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fishid"
version = "0.1.0"
description = "Identify, measure, and check California regulations for a caught fish from a photo."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pyyaml>=6",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "scikit-image>=0.23",
    "shapely>=2.0",
    "pillow>=10",
    "exifread>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
models = [
    "torch>=2.3",
    "torchvision>=0.18",
    "open_clip_torch>=2.26",
    "transformers>=4.57",
    "ultralytics>=8.3.150",
]
dev = ["pytest>=8"]

[project.scripts]
fishid = "fishid.__main__:main"

[tool.setuptools.packages.find]
include = ["fishid*"]

[tool.setuptools.package-data]
fishid = ["data/*.yaml", "data/regs/*/*.yaml", "data/geo/*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real models (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
